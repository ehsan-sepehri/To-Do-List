<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To-Do-List</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <div class="container">
      <div class="row">
        <div class="card">
          <section class="menu">
            <div class="left-saide">
              <div class="time">00:00</div>
              <div class="days">Saturday</div>
              <div class="days">Sunday</div>
              <div class="days">Monday</div>
              <div class="days">Tuesday</div>
              <div class="days">Wednesday</div>
              <div class="days">Thursday</div>
              <div class="days">Friday</div>
            </div>
          </section>
          <section class="list-item">
            <button class="create-to-do">Create To Do</button>
            <!--TODOs section  loded from js  -->
            <div class="new-to-do">
              <p class="text-to-do">Lorem ipsum dolor sit amet consectetur</p>
              <div class="section-button">
                <button class="sucsses">Sucsses</button>
                <button class="edit-to-do">Edit</button>
                <button class="remove-to-do">Remove</button>
              </div>
            </div>
          </section>
        </div>
      </div>
    </div>
    <section class="create-to-dos">
      <input type="text" />
    </section>

    <script src="./js/app.js"></script>
  </body>
</html>
