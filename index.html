<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To-Do-List</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body onload="loadDataLocal()">
    <div class="container">
      <div class="row">
        <div class="card">
          <section class="menu">
            <div class="left-saide">
              <div class="time">00:00</div>
              <div class="days">Saturday</div>
              <div class="days">Sunday</div>
              <div class="days">Monday</div>
              <div class="days">Tuesday</div>
              <div class="days">Wednesday</div>
              <div class="days">Thursday</div>
              <div class="days">Friday</div>
            </div>
          </section>
          <section class="list-item">
            <button class="create-to-do"><span>+</span>CreateToDo</button>
            <div class="list-item-todo">
            <!--TODOs section  loded from js  -->
            </div>
          </section>
        </div>
      </div>
    </div>
    <section class="create-to-dos hide">
      <p>hi What is today's activity?</p>
      <div class="input-activity">
        <input
          class="text-todo name-todo"
          type="text"
          placeholder="Name of the activity"
        />
        <input
          class="text-todo date-to-do"
          type="text"
          placeholder="Day of the activity"
        />
      </div>
      <div class="butonnes">
        <button class="cancel">Cancel</button>
        <button class="done">Done</button>
      </div>
    </section>

    <script src="./js/app.js"></script>
  </body>
</html>
